<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fort Apocalypse</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  :root { --bar: 36px; }
  /* The canvas fills the frame above the controls; the emulator letterboxes
     its own picture inside it (against bgcolor), so no aspect math is needed
     here. */
  #canvas {
    display: block; width: 100vw; height: calc(100vh - var(--bar));
    background: #000; outline: none;
    image-rendering: pixelated;            /* crisp upscale for nearest scaling */
    image-rendering: crisp-edges;
    touch-action: none;                    /* touch drives the absolute tablet, not browser gestures */
  }
  /* Hidden unless the program fails to load (or for ?credits). */
  #msg {
    position: fixed; inset: 0; display: none; place-items: center;
    text-align: center; padding: 1em; color: #c7d0d9;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #controls {
    height: var(--bar); line-height: var(--bar); box-sizing: border-box;
    border-top: 1px solid #303335; color: #9ca0a5; text-align: center;
    font: 13px/34px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    white-space: nowrap; overflow: hidden;
  }
  /* Browsers keep audio off until a click, so the overlay shows a prompt to
     click. */
  #overlay {
    position: fixed; inset: 0 0 var(--bar) 0;
    display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(0, 0, 0, .82); cursor: pointer; padding: 0 16px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .3s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .play { font-size: 20px; color: #3d94ff; font-weight: 600; }
  #overlay .hint { font-size: 13px; color: #9ca0a5; max-width: 36em; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="controls">Arrows, WASD or keypad to move, Space to fire, P to pause, Esc for options.</div>
  <div id="msg"></div>
  <div id="overlay">
    <div class="play" id="overlay-title">Loading&hellip;</div>
    <div class="hint" id="overlay-hint">Starting the WebAssembly module</div>
  </div>
  <script>
    /* =====================================================================
     *  DEPLOY CONFIG — edit this block, then re-zip the folder and upload.
     *  Nothing else in this file needs changing. See README.txt for steps.
     * ===================================================================== */
    var CONFIG = {
      rom:    'fort.rp6502',               // your program, sitting next to this file
      title:  'Fort Apocalypse',           // browser tab title
      bg:     '000000',                    // letterbox fill, 6 hex digits (no '#')
      filter: 'sharp',                     // pixel scaling: nearest | linear | sharp
      db:     '',                          // save database name; blank = the rom filename
    };
    /* ===================== end of editable section ====================== */

    document.title = CONFIG.title;

    (function () {
      var canvas = document.getElementById('canvas');
      var msg = document.getElementById('msg');
      var overlay = document.getElementById('overlay');

      // Nothing reaches the speakers until the reader asks for it. Suspending
      // the context does not work: sokol installs its own onstatechange that
      // resumes anything suspended, so it wins. Hold the graph apart instead —
      // sokol connects its node once at init and never looks again.
      var audioGated = true;
      var deferredConnects = [];
      var nativeConnect = AudioNode.prototype.connect;
      AudioNode.prototype.connect = function (dest) {
        if (audioGated && dest instanceof AudioDestinationNode) {
          deferredConnects.push([this, arguments]);
          return dest;
        }
        return nativeConnect.apply(this, arguments);
      };
      function ungateAudio() {
        if (!audioGated) return;
        audioGated = false;
        AudioNode.prototype.connect = nativeConnect;
        deferredConnects.splice(0).forEach(function (c) {
          nativeConnect.apply(c[0], c[1]);
        });
      }
      var overlayTitle = document.getElementById('overlay-title');
      var overlayHint = document.getElementById('overlay-hint');
      // The overlay paints over #msg, so a message hides the overlay first.
      function fail(t) {
        overlay.classList.add('hidden');
        msg.textContent = t;
        msg.style.display = 'grid';
      }

      function load() {
        var s = document.createElement('script');
        s.src = 'rp6502.js';
        s.onerror = function () { fail('Could not load rp6502.js'); };
        document.body.appendChild(s);
      }

      var bg = String(CONFIG.bg || '').replace(/^#/, '');
      var hasBg = /^[0-9a-fA-F]{6}$/.test(bg);
      if (hasBg) canvas.style.background = document.body.style.background = '#' + bg;
      var filter = String(CONFIG.filter || '').toLowerCase();
      var hasFilter = filter === 'nearest' || filter === 'linear' || filter === 'sharp';
      // The GL filter does the real scaling; only an explicit nearest keeps the
      // browser's own canvas-CSS step pixelated (it bites on hi-dpi).
      if (filter !== 'nearest') canvas.style.imageRendering = 'auto';

      // ?credits dumps every bundled component's license notice (the emulator's
      // built-in --credits). There is no on-page link — it's the attribution
      // path for anyone who redistributes the emulator. See README.txt.
      if (new URLSearchParams(location.search).has('credits')) {
        var lines = [];
        window.Module = {
          arguments: ['--credits'],
          print: function (t) {
            lines.push(t);
            msg.style.display = 'grid';
            msg.innerHTML = '<pre style="text-align:left;white-space:pre;max-width:92vw;'
              + 'max-height:92vh;overflow:auto;margin:0;'
              + 'font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace">'
              + lines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
          },
          printErr: function (t) { console.warn(t); },
        };
        overlay.classList.add('hidden');
        load();
        return; // the wasm prints the notices and exits
      }

      function baseName(u) {
        var s = u.split('#')[0].split('?')[0], i = s.lastIndexOf('/');
        return (i >= 0 ? s.slice(i + 1) : s) || 'rom.rp6502';
      }
      function sanitize(s) { return s.replace(/[^A-Za-z0-9._-]/g, '_').slice(0, 180) || 'default'; }

      var base = baseName(CONFIG.rom);
      var dbname = sanitize(String(CONFIG.db || '') || base);
      var args = ['--save-dir', '/saves'];
      if (hasBg) args.push('--bgcolor', bg);
      if (hasFilter) args.push('--filter', filter);
      args.push('/roms/' + base);

      // Failures must land on the page, not just the DevTools console: keep a
      // tail of stderr, and surface any uncaught error/rejection (a crashed
      // wasm runtime otherwise leaves a silent black canvas).
      var errTail = [];
      window.addEventListener('error', function (e) {
        fail('Emulator crashed: ' + e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        fail('Emulator crashed: ' + ((e.reason && e.reason.message) || e.reason));
      });

      var Module = {
        canvas: canvas,
        arguments: args,
        print: function (t) { console.log(t); },
        printErr: function (t) {
          console.error(t);
          errTail.push(t);
          if (errTail.length > 12) errTail.shift();
        },
        postRun: [function () {
          // When startup gets as far as sapp_run, sokol creates a webgl2 context
          // on the canvas and a 2d probe returns null; a non-null 2d context
          // means startup bailed before rendering (bad option, install/load
          // failure) with the reason on stderr. The probe runs in postRun, after
          // main has returned, so it cannot disturb startup.
          if (canvas.getContext('2d'))
            fail('Emulator failed to start: ' + (errTail.join(' · ') || 'see the browser console'));
        }],
        preRun: [function () {
          var M = Module;
          // The ROM is kept in memory at /roms, and SAVE: opens files in
          // /saves, which is IDBFS, mirrored to an IndexedDB database named
          // by CONFIG.db.
          M.FS.mkdir('/roms');
          M.FS.mount(M.MEMFS, {}, '/roms');
          M.FS.mkdir('/saves');
          var I = M.IDBFS;
          // IDBFS names a database after its mountpoint, so the mountpoint
          // is swapped for dbname here.
          var getDB = I.getDB;
          I.getDB = function (name, cb) {
            return getDB(name === '/saves' ? dbname : name, cb);
          };
          // Keys are stored mount-relative ('save.dat', not '/saves/save.dat'),
          // so a database holds no mountpoint and saves made under the earlier
          // /db mountpoint still load. IDBFS uses one string as both VFS path
          // and database key, so the path is translated on the remote side
          // only: the mountpoint is prepended on the way out and stripped on
          // the way in.
          var strip = function (p) { return p.slice('/saves/'.length); };
          var grs = I.getRemoteSet, lre = I.loadRemoteEntry;
          var sre = I.storeRemoteEntry, rre = I.removeRemoteEntry;
          I.getRemoteSet = function (mount, cb) {
            grs(mount, function (err, remote) {
              if (remote && remote.entries) {
                var entries = {};
                for (var k in remote.entries) entries['/saves/' + k] = remote.entries[k];
                remote.entries = entries;
              }
              cb(err, remote);
            });
          };
          I.loadRemoteEntry = function (store, path, cb) { return lre(store, strip(path), cb); };
          I.storeRemoteEntry = function (store, path, entry, cb) { return sre(store, strip(path), entry, cb); };
          I.removeRemoteEntry = function (store, path, cb) { return rre(store, strip(path), cb); };
          // autoPersist drops the error of each sync it starts, so every
          // IDBFS sync logs its failure here.
          var syncfs = I.syncfs;
          I.syncfs = function (mount, populate, cb) {
            syncfs(mount, populate, function (err) {
              if (err) console.error('IDBFS:', err);
              cb(err);
            });
          };
          // autoPersist queues a sync after a close that wrote and after a
          // create, unlink, rename or rmdir, batching a frame's changes into
          // one transaction. A syncfs from the program returns once
          // FS.syncfs has finished.
          var ops = M.FS.mount(I, {autoPersist: true}, '/saves').node_ops;
          // A sync stores only entries whose mtime changed, and MEMFS changes
          // it only on a write, so a truncate or a chmod would never be stored.
          // Marking the node modified lets the close after an O_TRUNC queue
          // the sync as a write would.
          var setattr = ops.setattr;
          ops.setattr = function (node, attr) {
            var changed = (attr.size !== undefined && attr.size !== node.usedBytes) ||
                          (attr.mode !== undefined && attr.mode !== node.mode);
            setattr(node, attr);
            if (changed) {
              node.mtime = Date.now();
              node.isModified = true;
            }
          };
          M.addRunDependency('idbfs');
          M.FS.syncfs(true, function () { M.removeRunDependency('idbfs'); });
          M.addRunDependency('rom');
          fetch(CONFIG.rom).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.arrayBuffer();
          }).then(function (buf) {
            M.FS.writeFile('/roms/' + base, new Uint8Array(buf));
          }).catch(function (e) {
            fail('Could not load ' + CONFIG.rom + ' (' + e.message + ').');
          }).finally(function () { M.removeRunDependency('rom'); });
        }],
        onRuntimeInitialized: function () { gateAudio(); initGamepadBridge(); },
        onAbort: function (w) { fail(String(w)); },
      };
      window.Module = Module;

      // The game runs from load with no sound until the first click.
      function start() {
        ungateAudio();
        var ctx = Module._saudio_context;
        if (ctx && ctx.state !== 'running') ctx.resume();
        overlay.classList.add('hidden');
        canvas.focus({ preventScroll: true });
        window.removeEventListener('keydown', start);
        overlay.removeEventListener('click', start);
      }
      overlay.addEventListener('click', start);
      window.addEventListener('keydown', start);

      function gateAudio() {
        overlayTitle.textContent = '▶ Play';
        overlayHint.textContent = 'Click to start (enables sound)';
      }

      // Best-effort save flush when the tab is hidden/closed (async, so an abrupt
      // close may miss it). The guard avoids overlapping syncfs calls.
      var syncing = false;
      function flush() {
        if (!Module.FS || syncing) return;
        syncing = true;
        try { Module.FS.syncfs(false, function () { syncing = false; }); }
        catch (e) { syncing = false; }
      }
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flush();
      });

      // ----- Gamepad bridge (browser Gamepad API -> emulator) -----
      // Privacy-gated: nothing reads navigator.getGamepads() until the running
      // program maps the gamepad report block into XRAM (it calls xreg_ria_gamepad,
      // flipping gamepad_mapped()). A 250 ms watcher checks that flag; only then
      // do we poll the four gamepads per frame and forward each.
      // If the program releases the block we stop and resume watching, so the
      // browser only touches the gamepad while a ROM asks for it.
      function initGamepadBridge() {
        var mapped = Module._gamepad_mapped;
        var report = Module._gamepad_host;
        var disconnect = Module._gamepad_disconnect;
        if (!mapped || !report || !disconnect) return; // exports absent

        var polling = false, raf = 0, watch = 0;
        var connected = [false, false, false, false];

        function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
        function axis(v) { return clamp(Math.round((v || 0) * 127), -128, 127); }
        function trig(btn) { return btn ? clamp(Math.round(btn.value * 255), 0, 255) : 0; }
        // Face button labels: 3 PlayStation, 2 Eastern BA, 1 Western AB, 0 when
        // the id does not identify the pad or buttons[] is in the device's order.
        function padType(gp) {
          if (gp.mapping !== 'standard') return 0;
          var id = gp.id;
          if (/054c|0ce6|dualshock|dualsense|playstation|sony/i.test(id)) return 3;
          // Pro Controller or Joy-Con pair; a lone Joy-Con held sideways fits no row.
          if (/057e\D+20(09|0e)/i.test(id)) return 2;
          if (/045e|xbox|xinput/i.test(id)) return 1;
          return 0;
        }

        function poll() {
          if (!mapped()) { stop(); return; } // program released the gamepad
          var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (var p = 0; p < 4; p++) {
            var gp = gamepads[p];
            if (!gp) {
              if (connected[p]) { disconnect(p); connected[p] = false; }
              continue;
            }
            var b = gp.buttons, a = gp.axes;
            function on(i) { return (b[i] && b[i].pressed) ? 1 : 0; }
            // RP6502 canonical bit layout (mirrors emu gamepad.c / the tester ROM).
            var dpad = (on(12) ? 0x01 : 0) | (on(13) ? 0x02 : 0) |
                       (on(14) ? 0x04 : 0) | (on(15) ? 0x08 : 0);
            var b0 = (on(0) ? 0x01 : 0) | (on(1) ? 0x02 : 0) | (on(2) ? 0x08 : 0) |
                     (on(3) ? 0x10 : 0) | (on(4) ? 0x40 : 0) | (on(5) ? 0x80 : 0);
            var type = padType(gp);
            // The standard mapping places Nintendo face buttons by position.
            if (type === 2)
              b0 = (b0 & 0xE4) | (b0 & 0x09) << 1 | (b0 & 0x12) >> 1;
            var b1 = (on(6) ? 0x01 : 0) | (on(7) ? 0x02 : 0) | (on(8) ? 0x04 : 0) |
                     (on(9) ? 0x08 : 0) | (on(16) ? 0x10 : 0) | (on(10) ? 0x20 : 0) |
                     (on(11) ? 0x40 : 0);
            report(p, dpad, b0, b1, axis(a[0]), axis(a[1]), axis(a[2]), axis(a[3]),
                   trig(b[6]), trig(b[7]), type, a.length >= 4 ? 1 : 0);
            connected[p] = true;
          }
          raf = requestAnimationFrame(poll);
        }
        function start() { if (!polling) { polling = true; raf = requestAnimationFrame(poll); } }
        function stop() {
          polling = false;
          if (raf) { cancelAnimationFrame(raf); raf = 0; }
          for (var p = 0; p < 4; p++) if (connected[p]) { disconnect(p); connected[p] = false; }
          if (!watch) watch = setInterval(check, 250); // watch for the next mapping
        }
        function check() { if (mapped()) { clearInterval(watch); watch = 0; start(); } }
        watch = setInterval(check, 250);
      }

      // Each window loads a separate copy of the database, and a sync makes
      // the database match that copy, so two windows on one database would
      // undo each other's saves. The lock is held until the window closes.
      function boot() {
        msg.style.display = 'none';
        load();
        return new Promise(function () {});
      }
      if (navigator.storage) navigator.storage.persist().catch(console.error);
      if (navigator.locks) {
        navigator.locks.request(dbname, {ifAvailable: true}, function (lock) {
          if (lock) return boot();
          overlay.classList.add('hidden');
          msg.textContent = 'This game is running in another window';
          msg.style.display = 'grid';
          return navigator.locks.request(dbname, boot);
        }).catch(function (e) {
          // Where the browser blocks storage, the lock request fails too,
          // and the game runs with its saves in memory only.
          console.error(e);
          boot();
        });
      } else {
        load();
      }
    })();
  </script>
</body>
</html>

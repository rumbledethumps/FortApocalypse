# The Atari program uses its original memory map. Its variables and
# buffers are at fixed addresses below $5000, and the program is at $9221,
# where it was in the cartridge. Tables that do not fit below it follow it.
# The Atari hardware registers are RAM at $D000-$D5FF, and the OS vertical
# blank exits are at $E45F-$E464.
MEMORY {
    ZP:     start = $0000, size = $0012, type = rw, file = "";
    MAIN:   start = $5000, size = $4200, type = ro, file = %O, fill = yes;
    STUB:   start = $9200, size = $0021, type = ro, file = %O, fill = yes;
    CART:   start = $9221, size = $2DE4, type = ro, file = %O, fill = yes;
    MORE:   start = $C005, size = $0FFB, type = ro, file = %O;
    SHADOW: start = $D600, size = $0E5F, type = rw, file = "";
    BSS:    start = $E465, size = $1A9B, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    STARTUP:  load = STUB,   type = ro;
    CART:     load = CART,   type = ro;
    LEVELS:   load = MAIN,   type = ro;
    TABLES:   load = MORE,   type = ro;
    SHADOW:   load = SHADOW, type = bss;
    BSS:      load = BSS,    type = bss, define = yes;
}
